<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Where the agent protocols sit</title>
  <desc id="desc">AG-UI connects the user's app with the agent. MCP connects the agent with tools and data. A2A connects the agent with other agents. A2UI is no connection but a format for UI descriptions, which travel over AG-UI or A2A. The demo uses AG-UI; its tools call the data backend over plain HTTP.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="16" fill="#ffffff"/>

  <!-- App -->
  <rect x="30" y="140" width="190" height="100" rx="12" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="125" y="176" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">User's app</text>
  <text x="125" y="198" font-size="13" fill="#1f2937" text-anchor="middle">Angular, React,</text>
  <text x="125" y="216" font-size="13" fill="#1f2937" text-anchor="middle">a chat client …</text>

  <!-- Agent -->
  <rect x="345" y="140" width="190" height="100" rx="12" fill="#fff4e5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="440" y="176" font-size="17" font-weight="700" fill="#7c2d12" text-anchor="middle">Agent</text>
  <text x="440" y="198" font-size="13" fill="#1f2937" text-anchor="middle">model + tools + loop</text>
  <text x="440" y="216" font-size="13" fill="#1f2937" text-anchor="middle">(e.g. Mastra)</text>

  <!-- Tools -->
  <rect x="660" y="40" width="190" height="100" rx="12" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/>
  <text x="755" y="76" font-size="17" font-weight="700" fill="#14532d" text-anchor="middle">Tools and data</text>
  <text x="755" y="98" font-size="13" fill="#1f2937" text-anchor="middle">APIs, files,</text>
  <text x="755" y="116" font-size="13" fill="#1f2937" text-anchor="middle">databases</text>

  <!-- Other agent -->
  <rect x="660" y="240" width="190" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="755" y="276" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Other agents</text>
  <text x="755" y="298" font-size="13" fill="#1f2937" text-anchor="middle">another team,</text>
  <text x="755" y="316" font-size="13" fill="#1f2937" text-anchor="middle">another vendor</text>

  <!-- AG-UI -->
  <line x1="223" y1="190" x2="341" y2="190" stroke="#c2410c" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="282" y="172" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">AG-UI</text>
  <text x="282" y="214" font-size="12" fill="#4b5563" text-anchor="middle">agent ↔ user</text>

  <!-- MCP -->
  <line x1="537" y1="170" x2="656" y2="100" stroke="#374151" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="598" y="108" font-size="16" font-weight="700" fill="#111827" text-anchor="end">MCP</text>
  <text x="598" y="126" font-size="12" fill="#4b5563" text-anchor="end">agent ↔ tools</text>

  <!-- A2A -->
  <line x1="537" y1="210" x2="656" y2="280" stroke="#374151" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="598" y="268" font-size="16" font-weight="700" fill="#111827" text-anchor="end">A2A</text>
  <text x="598" y="286" font-size="12" fill="#4b5563" text-anchor="end">agent ↔ agent</text>

  <!-- A2UI payload -->
  <rect x="180" y="262" width="240" height="78" rx="10" fill="#fefce8" stroke="#a16207" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="300" y="286" font-size="15" font-weight="700" fill="#713f12" text-anchor="middle">A2UI</text>
  <text x="300" y="309" font-size="12" fill="#1f2937" text-anchor="middle">a format for UI descriptions,</text>
  <text x="300" y="330" font-size="12" fill="#1f2937" text-anchor="middle">travels over AG-UI or A2A</text>
  <line x1="300" y1="260" x2="290" y2="222" stroke="#a16207" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Demo note -->
  <rect x="30" y="374" width="820" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="398" font-size="13" fill="#1f2937">This demo uses AG-UI between Angular and Mastra. Its tools call the data backend over plain HTTP.</text>
</svg>
