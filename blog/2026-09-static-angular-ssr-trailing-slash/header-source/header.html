<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap');
html,body{margin:0;padding:0}
.c{position:relative;width:2000px;height:1050px;overflow:hidden;font-family:Inter,system-ui,sans-serif}
.bg{position:absolute;left:0;top:-42px;width:2000px;height:1136px;background:url(signs-orig.jpg) center/cover}
.label{position:absolute;left:0;top:0;width:1000px;height:400px;transform-origin:0 0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#1e293b;white-space:nowrap}
.label span.pink{color:#DC087D}
.logo{position:absolute;right:-180px;top:145px;height:760px}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.12) 58%,rgba(0,0,0,.28) 66%,rgba(0,0,0,.46) 74%,rgba(0,0,0,.64) 82%,rgba(0,0,0,.8) 90%,rgba(0,0,0,.9) 100%)}
</style></head><body><div class="c">
<div class="bg"></div>
<div class="fade"></div>
<img class="logo" src="angular-logo-white.svg" alt="">
<div class="label" data-quad="500,289 950,337 952,492 500,502" style="font-size:190px;letter-spacing:-4px">Good SEO</div>
<div class="label" data-quad="505,550 945,538 950,695 505,764" style="font-size:190px;letter-spacing:-4px">Nice URLs</div>
<div class="label" data-quad="345,801 1085,758 1093,938 345,997" style="font-size:178px;letter-spacing:-4px;width:1450px">Why Not&nbsp;<span class="pink">Both?</span></div>
</div>
<script>
// Homography mapping the element's rectangle (0,0,w,h) onto a quadrilateral (tl, tr, br, bl).
function solve(A, b) {
  const n = b.length;
  for (let i = 0; i < n; i++) {
    let m = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r;
    [A[i], A[m]] = [A[m], A[i]]; [b[i], b[m]] = [b[m], b[i]];
    for (let r = i + 1; r < n; r++) { const f = A[r][i] / A[i][i]; for (let c = i; c < n; c++) A[r][c] -= f * A[i][c]; b[r] -= f * b[i]; }
  }
  const x = Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) { let s = b[i]; for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c]; x[i] = s / A[i][i]; }
  return x;
}
for (const el of document.querySelectorAll('.label')) {
  const w = el.offsetWidth, h = el.offsetHeight;
  const dst = el.dataset.quad.split(' ').map(p => p.split(',').map(Number));
  const src = [[0, 0], [w, 0], [w, h], [0, h]];
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  const [a, b1, c, d, e, f, g, hh] = solve(A, b);
  el.style.transform = `matrix3d(${a},${d},0,${g},${b1},${e},0,${hh},0,0,1,0,${c},${f},0,1)`;
}
</script></body></html>
