<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8" /></marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626" /></marker>
    <marker id="arr-ok" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a" /></marker>
  </defs>

  <!-- Today -->
  <text x="10" y="22" fill="#475569" font-size="13" font-weight="bold">Today: prerendered as blog/index.html</text>

  <rect x="10" y="40" width="110" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="65" y="70" text-anchor="middle" fill="#475569" font-size="12" font-weight="bold">Browser</text>
  <text x="65" y="88" text-anchor="middle" fill="#475569" font-size="10">or crawler</text>

  <line x1="120" y1="58" x2="270" y2="58" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr-g)" />
  <text x="195" y="51" text-anchor="middle" fill="#475569" font-size="10">GET /blog</text>
  <line x1="270" y1="80" x2="120" y2="80" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r)" />
  <text x="195" y="96" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">301 → /blog/</text>

  <rect x="270" y="40" width="130" height="70" rx="6" fill="#7c3aed" />
  <text x="335" y="68" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Static host</text>
  <text x="335" y="86" text-anchor="middle" fill="#ddd6fe" font-size="10">blog/ is a folder</text>

  <line x1="400" y1="75" x2="470" y2="75" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr-g)" />
  <text x="435" y="68" text-anchor="middle" fill="#475569" font-size="10">GET /blog/</text>

  <rect x="470" y="40" width="240" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="590" y="64" text-anchor="middle" fill="#475569" font-size="11" font-weight="bold">200 blog/index.html</text>
  <text x="590" y="82" text-anchor="middle" fill="#475569" font-size="10">Angular router removes the slash again</text>
  <text x="590" y="98" text-anchor="middle" fill="#475569" font-size="10">address bar: /blog</text>

  <!-- With prerenderFormat: 'file' -->
  <text x="10" y="162" fill="#16a34a" font-size="13" font-weight="bold">With prerenderFormat: 'file': prerendered as blog.html</text>

  <rect x="10" y="180" width="110" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="65" y="210" text-anchor="middle" fill="#475569" font-size="12" font-weight="bold">Browser</text>
  <text x="65" y="228" text-anchor="middle" fill="#475569" font-size="10">or crawler</text>

  <line x1="120" y1="198" x2="270" y2="198" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr-g)" />
  <text x="195" y="191" text-anchor="middle" fill="#475569" font-size="10">GET /blog</text>
  <line x1="270" y1="220" x2="120" y2="220" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-ok)" />
  <text x="195" y="236" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="bold">200 blog.html</text>

  <rect x="270" y="180" width="130" height="70" rx="6" fill="#16a34a" />
  <text x="335" y="208" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Static host</text>
  <text x="335" y="226" text-anchor="middle" fill="#dcfce7" font-size="10">serves blog.html</text>

  <text x="420" y="212" fill="#16a34a" font-size="12" font-weight="bold">No redirect. Clean URL.</text>
  <text x="420" y="230" fill="#475569" font-size="10">Same URL in links, canonical tag, sitemap</text>
  <text x="420" y="244" fill="#475569" font-size="10">and address bar.</text>
</svg>
