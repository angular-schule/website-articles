<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569" /></marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626" /></marker>
    <marker id="arr-ok" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a" /></marker>
  </defs>

  <!-- Participants -->
  <rect x="40" y="10" width="140" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="110" y="32" text-anchor="middle" fill="#475569" font-size="13" font-weight="bold">Browser</text>
  <rect x="540" y="10" width="140" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="610" y="32" text-anchor="middle" fill="#475569" font-size="13" font-weight="bold">Static host</text>
  <line x1="110" y1="44" x2="110" y2="342" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="610" y1="44" x2="610" y2="342" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Today -->
  <text x="360" y="68" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="bold">Today: blog/my-article/index.html</text>

  <line x1="110" y1="100" x2="606" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arr-g)" />
  <text x="360" y="94" text-anchor="middle" fill="#475569" font-size="12">1. GET /blog/my-article</text>

  <line x1="610" y1="130" x2="114" y2="130" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r)" />
  <text x="360" y="124" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="bold">301, Location: /blog/my-article/</text>

  <line x1="110" y1="160" x2="606" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arr-g)" />
  <text x="360" y="154" text-anchor="middle" fill="#475569" font-size="12">2. GET /blog/my-article/</text>

  <line x1="610" y1="190" x2="114" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arr-g)" />
  <text x="360" y="184" text-anchor="middle" fill="#475569" font-size="12">200, blog/my-article/index.html</text>

  <rect x="20" y="202" width="300" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="30" y="219" fill="#991b1b" font-size="11">3. Angular router changes the address bar</text>
  <text x="30" y="234" fill="#991b1b" font-size="11">back to /blog/my-article (client side only)</text>

  <!-- With blog/my-article.html -->
  <text x="360" y="274" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="bold">With blog/my-article.html</text>

  <line x1="110" y1="306" x2="606" y2="306" stroke="#475569" stroke-width="2" marker-end="url(#arr-g)" />
  <text x="360" y="300" text-anchor="middle" fill="#475569" font-size="12">1. GET /blog/my-article</text>

  <line x1="610" y1="336" x2="114" y2="336" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-ok)" />
  <text x="360" y="330" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="bold">200, blog/my-article.html. Done.</text>
</svg>
